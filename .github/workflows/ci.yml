name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go vet and test (race)
    # ubuntu-24.04, not -latest: on 2026-11-01 -latest moved to 26.04, whose runner scope will not delegate the cgroup v2
    # controllers the real desk sandbox test needs (test_a_real_desk_in_the_sandbox), and has no Python 3.9.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The end-to-end tests run the real Python dry-run plugin; PyAV (+ numpy) decodes the test pattern with libavcodec.
      - run: pip install av numpy
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: sh scripts/test-link-brand.sh
      - run: go vet ./...
      # The job worker's tests skip where jobs cannot run sandboxed: unprivileged, the runner's cgroup is not delegated
      # (and Ubuntu's AppArmor restricts unprivileged user namespaces).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # The skill runner runs a skill tool with this Node.js. Test the runner itself here; its tests use --permission,
      # so this must be Node.js 22.13 or newer, not a distro's Node 18.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test internal/skills/skill_runner.test.js
      # A job's private root holds /usr only: put the runner's Node.js where the root sandbox test below can see it.
      - run: sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
      - run: go test -race -count=1 ./...
      # The tray's desktop notifications, against a fake notification server on a private session bus.
      - name: tray notifications (private D-Bus)
        run: |
          command -v dbus-run-session >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq dbus; }
          dbus-run-session -- go test -race -count=1 -v -run DesktopNotifier ./cmd/openvibe-link | tee /tmp/notify.log
          grep -q -- '--- PASS: TestDesktopNotifierAsksAndHearsTheButtons' /tmp/notify.log
      # So they run again as root (jobs as nobody), in a systemd scope with its cgroup delegated, where
      # OPENVIBE_WORKER_TESTS=require makes them fail instead of skipping. Each test binary lies alone in a directory
      # nobody can read, as a function's executable must (a job gets a copy of that directory).
      - name: worker sandbox tests (root)
        run: |
          d=$(mktemp -d) && chmod 755 "$d"
          for t in 'worker .' 'agent ^(TestJobRunsOverTheLink|TestLocalStopEndsJobs)$'; do
            set -- $t
            mkdir -m 755 "$d/$1"
            go test -race -c -o "$d/$1/$1.test" ./internal/$1
            (cd internal/$1 && sudo systemd-run --scope --quiet -p Delegate=yes \
              env OPENVIBE_WORKER_TESTS=require "$d/$1/$1.test" -test.count=1 -test.v -test.run "$2")
          done
      # A desk host for other people (computer plugin desk_isolation sandbox): the plugin, as root, drives a real
      # browser desk through `openvibe-link desk-sandbox`. The shell stands in for the Node, which moves itself into its
      # openvibe-link leaf and enables the controllers (its worker's probe) before any plugin starts.
      - name: shared desk host (root)
        run: |
          d=$(mktemp -d) && chmod 755 "$d"
          go build -o "$d/openvibe-link" ./cmd/openvibe-link
          mkdir -m 700 "$d/config" "$d/state"
          echo '{"worker":{"enabled":true,"run_as":{"uid":65534,"gid":65534}}}' > "$d/config/config.json"
          sudo systemd-run --scope --quiet -p Delegate=yes env OPENVIBE_DESK_SANDBOX_TESTS=require \
            OPENVIBE_LINK_EXE="$d/openvibe-link" OPENVIBE_LINK_CONFIG="$d/config" OPENVIBE_LINK_STATE="$d/state" sh -c '
              cg=/sys/fs/cgroup$(sed -n "s/^0:://p" /proc/self/cgroup)
              mkdir "$cg/openvibe-link" && echo $$ > "$cg/openvibe-link/cgroup.procs"
              echo "+memory +pids +cpu +io" > "$cg/cgroup.subtree_control"
              : | "$OPENVIBE_LINK_EXE" desk-sandbox --memory-mb 256 -- /bin/sh -c "echo desk-sandbox runs >&4" 3<&0 4>&1 | cat
              exec python3 plugins/computer/tests/test_shared_desks.py -v RealSharedDeskTest'

  build:
    name: cross-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The packages are built on every run so a broken .deb/.rpm is caught before a tag: dpkg-deb ships with Ubuntu,
      # rpm (rpmbuild) does not.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - run: scripts/dist.sh ci
      # OpenVibe.Bot's /install route and BOT_INSTALLER_SOURCE_URL are documented to serve this exact release asset.
      - run: test -s dist/install.sh && cmp -s install/install.sh dist/install.sh
      - name: every OS, architecture and package the release promises is in dist
        run: |
          for f in \
            dist/openvibe-link-linux-amd64 dist/openvibe-link-linux-arm64 \
            dist/openvibe-link-darwin-amd64 dist/openvibe-link-darwin-arm64 \
            dist/openvibe-link-windows-amd64.exe dist/openvibe-link-windows-arm64.exe \
            dist/openvibe-link_*_amd64.deb dist/openvibe-link_*_arm64.deb \
            dist/openvibe-link-*-1.x86_64.rpm dist/openvibe-link-*-1.aarch64.rpm \
            dist/openvibe-link_*_linux_amd64.tar.gz dist/openvibe-link_*_linux_arm64.tar.gz \
            dist/openvibe-link_*_darwin_amd64.tar.gz dist/openvibe-link_*_darwin_arm64.tar.gz; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: the packages carry the program, not just a file
        run: |
          for f in dist/*.deb; do
            dpkg-deb -c "$f" > /tmp/pkg.txt
            grep -q 'usr/local/bin/openvibe-link$' /tmp/pkg.txt
          done
          for f in dist/*.rpm; do
            rpm -qpl "$f" > /tmp/pkg.txt
            grep -qx '/usr/local/bin/openvibe-link' /tmp/pkg.txt
          done
          for f in dist/openvibe-link_*.tar.gz; do
            tar -tzf "$f" > /tmp/pkg.txt
            grep -q '/install.sh$' /tmp/pkg.txt
            grep -q '/README.md$' /tmp/pkg.txt
          done
      - run: ls -l dist && cat dist/SHA256SUMS

  go-other-os:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The deadline across the real pipe to a Python plugin, the clock it shares with the core, strict timing and the
      # Python SDK's own suite, verbose so the log shows each ran on this OS (and its clock readings), never skipped.
      - name: deadlines across the pipe (verbose)
        run: go test -count=1 -v -run "TestQPC|TestTheClock|TestUntilAndSince|TestPython|TestHelloNamesTheSharedClock|TestPipeDelay|TestWriterQueue|TestStrictTiming" ./internal/mono ./internal/plugins
      # A plugin's own children must not outlive it on Windows (a Job Object, as the process group does on macOS):
      # verbose so the log shows this ran there rather than being skipped.
      - name: plugin process tree (verbose)
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run TestPluginKillEndsTheWholeTree ./internal/plugins
      - run: go test -count=1 ./...

  python:
    name: plugins (python ${{ matrix.python }})
    runs-on: ubuntu-24.04   # 26.04 (-latest since 2026-11-01) has no Python 3.9 to set up
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pillow numpy
      - run: python -m pytest -q plugins/sdk/tests
      - run: python -m pytest -q plugins/dryrun/tests
      - run: python -m pytest -q plugins/adeept_adr036/tests
      - run: python -m pytest -q plugins/cozmo/tests
      - run: python -m pytest -q plugins/relay/tests
      - run: python -m pytest -q plugins/ros2/tests
      - run: python -m pytest -q plugins/computer/tests
      - run: python -m pytest -q plugins/voice/tests
      # The machine-pool tests run llama.cpp RPC's stand-ins in their own user and network namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python -m pytest -q plugins/ai/tests
      - name: packages install
        run: pip install ./plugins/sdk ./plugins/dryrun ./plugins/adeept_adr036 ./plugins/cozmo ./plugins/relay ./plugins/ros2 ./plugins/computer ./plugins/voice ./plugins/ai

  # The bundled drivers where people run them: a LOOI or Cozmo bridge is often a Windows PC, a desk a Mac (owner,
  # 2026-10-27: "work well across multi-platform"). Every plugin's tests and packages, on Windows and macOS.
  python-other-os:
    name: plugins (${{ matrix.os }}, python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pillow numpy
      # One run per plugin (their test files share names), every one reported before the job fails.
      - name: each plugin's tests
        shell: bash
        run: |
          failed=""
          for d in sdk dryrun adeept_adr036 cozmo relay ros2 computer voice ai; do
            echo "::group::$d"
            python -m pytest -q "plugins/$d/tests" || failed="$failed $d"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed on ${{ matrix.os }}:$failed"; exit 1; fi
      - name: packages install
        run: pip install ./plugins/sdk ./plugins/dryrun ./plugins/adeept_adr036 ./plugins/cozmo ./plugins/relay ./plugins/ros2 ./plugins/computer ./plugins/voice ./plugins/ai

  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install/install.sh scripts/dist.sh scripts/test-install-stock-server.sh scripts/test-install-pair-args.sh scripts/test-install-worker-config.sh scripts/test-install-computer-config.sh scripts/test-install-plan-logins.sh scripts/test-install-claim.sh
      - run: sh scripts/test-install-stock-server.sh
      - run: sh scripts/test-install-pair-args.sh
      - run: sh scripts/test-install-worker-config.sh
      - run: sh scripts/test-install-computer-config.sh
      - run: sh scripts/test-install-plan-logins.sh
      - run: sh scripts/test-install-claim.sh

  esp32-conformance:
    name: esp32 protocol conformance (desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned ArduinoJson header
        run: |
          mkdir -p esp32/test/.deps
          curl -fL --retry 3 -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/bblanchon/ArduinoJson/releases/assets/265662161 \
            -o esp32/test/.deps/ArduinoJson.h
          echo 'a05ac98f4481d2398c103ca5ffcce8e2fcd7fa2fa1d8d9f38d5757454f448d97  esp32/test/.deps/ArduinoJson.h' | sha256sum -c -
      - run: sh esp32/test/run.sh

  esp32-compile:
    name: esp32 compile (arduino-cli)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the pinned core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          cache="$HOME/.arduino15/staging/packages"
          mkdir -p "$cache"
          stage_asset() {
            file=$1 repo=$2 asset=$3 checksum=$4
            curl -fLsS --retry 3 -H 'Accept: application/octet-stream' \
              "https://api.github.com/repos/$repo/releases/assets/$asset" -o "$cache/$file"
            printf '%s  %s\n' "$checksum" "$cache/$file" | sha256sum -c -
          }
          stage_asset esp32-arduino-libs-idf-release_v5.3-cfea4f7c-v1.zip espressif/esp32-arduino-lib-builder 218373742 1099291229a9be453c771c5867b8487a0266db9246b672417337b8f511d7f820
          stage_asset xtensa-esp-elf-13.2.0_20240530-x86_64-linux-gnu.tar.gz espressif/crosstool-NG 171009396 bce77e8480701d5a90545369d1b5848f6048eb39c0022d2446d1e33a8e127490
          stage_asset xtensa-esp-elf-gdb-14.2_20240403-x86_64-linux-gnu.tar.gz espressif/binutils-gdb 160240516 9d68472d4cba5cf8c2b79d94f86f92c828e76a632bd1e6be5e7706e5b304d36e
          stage_asset riscv32-esp-elf-13.2.0_20240530-x86_64-linux-gnu.tar.gz espressif/crosstool-NG 171009184 e7fbfffbb19dcd3764a9848a141bf44e19ad0b48e0bd1515912345c26fe52fba
          stage_asset riscv32-esp-elf-gdb-14.2_20240403-x86_64-linux-gnu.tar.gz espressif/binutils-gdb 160240334 ce004bc0bbd71b246800d2d13b239218b272a38bd528e316f21f1af2db8a4b13
          stage_asset openocd-esp32-linux-amd64-0.12.0-esp32-20241016.tar.gz espressif/openocd-esp32 200012418 e82b0f036dc99244bead5f09a86e91bb2365cbcd1122ac68261e5647942485df
          stage_asset esptool-v4.9.dev3-linux-amd64.tar.gz espressif/arduino-esp32 212736075 4ecaf51836cbf4ea3c19840018bfef3b0b8cd8fc3c95f6e1e043ca5bbeab9bf0
          stage_asset mkspiffs-0.2.3-arduino-esp32-linux64.tar.gz igrr/mkspiffs 6442020 5e1a4ff41385e842f389f6b5254102a547e566a06b49babeffa93ef37115cb5d
          stage_asset x86_64-linux-gnu.mklittlefs-c41e51a.200706.tar.gz earlephilhower/esp-quick-toolchain 22621400 66e84dda0aad747517da3785125e05738a540948aab2b7eaa02855167a1eea53
          stage_asset esp32-3.1.1.zip espressif/arduino-esp32 218876848 e20982b2860eab4900ce16a0f2b7f9fc3ffb205e490dc933f625d53a5c9e8129
          arduino-cli core install esp32:esp32@3.1.1
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "WebSockets@2.6.1"
      - name: Compile the example against this tree's library
        run: |
          mkdir -p build/ovlibs
          cp -r esp32 build/ovlibs/OpenVibeLink
          arduino-cli compile --fqbn esp32:esp32:esp32 --libraries build/ovlibs esp32/examples/Basic
