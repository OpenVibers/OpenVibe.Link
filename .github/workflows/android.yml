name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    name: Go core, unit tests and the APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the APK is attached to the release on a tag
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Go
        run: |
          curl -fL --retry 3 https://go.dev/dl/go1.24.7.linux-amd64.tar.gz -o "$RUNNER_TEMP/go1.24.7.linux-amd64.tar.gz"
          echo 'da18191ddb7db8a9339816f3e2b54bdded8047cdc2a5d67059478f8d1595c43f  '"$RUNNER_TEMP/go1.24.7.linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/go1.24.7.linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "$("$RUNNER_TEMP/go/bin/go" env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install pinned Gradle
        run: |
          curl -fL --retry 3 -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/207876967 \
            -o "$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  '"$RUNNER_TEMP/gradle-8.11.1-bin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle-8.11.1-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Cache pinned Kotlin compiler
        run: |
          artifact="$HOME/.m2/repository/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21"
          mkdir -p "$artifact"
          curl -fL --retry 3 -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/JetBrains/kotlin/releases/assets/587823233 \
            -o "$artifact/kotlin-compiler-embeddable-2.0.21.jar"
          echo '9fa8cdd1de0dccffe154c997d423ec6b5f53cd6d9177e3a77a9b0de03fb1bc81  '"$artifact/kotlin-compiler-embeddable-2.0.21.jar" | sha256sum -c -
          curl -fL --retry 3 \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom \
            -o "$artifact/kotlin-compiler-embeddable-2.0.21.pom"
          echo 'bd4656a46ec418252e5bc5e1c20eb2029fb2a8e0e3cc94eeddfac7e87c8cd5b6  '"$artifact/kotlin-compiler-embeddable-2.0.21.pom" | sha256sum -c -

      - name: Android NDK (gomobile needs one)
        run: |
          ndk=27.0.12077973
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Bind the Go core (gomobile, pinned)
        run: sh android/scripts/build-core.sh

      - name: The generated design files are current
        run: sh android/scripts/gen-design.sh --check

      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest

      - name: Debug APK
        run: gradle -p android :app:assembleDebug

      # A release APK is signed only when the runner has a key. The key is a repo secret; when it is absent the
      # step says so and is skipped, and no key is generated here.
      - name: The release key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set for this repository: the signed release APK is skipped, and no key is invented."
            echo "LINK_SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > android/release.keystore
          {
            echo "storeFile=../release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/release.keystore android/keystore.properties
          echo "LINK_SIGNED=1" >> "$GITHUB_ENV"

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/') && env.LINK_SIGNED == '1'
        run: gradle -p android :app:assembleRelease

      - name: APK sizes
        run: |
          for f in android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk; do
            [ -f "$f" ] || continue
            size=$(du -m "$f" | cut -f1)
            echo "| $f | ${size} MiB |" >> "$GITHUB_STEP_SUMMARY"
            echo "$f: ${size} MiB"
          done

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: openvibe-link-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Android job and the release job both attach to the tag, in either order.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OpenVibe Link $GITHUB_REF_NAME" --notes "OpenVibe Link for Android."
          if [ "${LINK_SIGNED:-0}" = "1" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "/tmp/openvibe-link-$GITHUB_REF_NAME.apk"
          else
            # No signing key in this repo: attach the installable debug build under a name that says so, rather than
            # inventing a key or leaving the release with no APK. The signed build attaches once the secret is set.
            cp android/app/build/outputs/apk/debug/app-debug.apk "/tmp/openvibe-link-$GITHUB_REF_NAME-debug.apk"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: attached the debug APK as openvibe-link-$GITHUB_REF_NAME-debug.apk"
          fi
          gh release upload "$GITHUB_REF_NAME" /tmp/openvibe-link-"$GITHUB_REF_NAME"*.apk --clobber

  screens:
    name: emulator screenshots (not blocking)
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: openvibe-link-debug
          path: android/app/build/outputs/apk/debug
      - name: Let the runner use the emulator's KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh android/scripts/screenshots.sh shots
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
