name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pillow numpy
      # Ubuntu's AppArmor restricts unprivileged user namespaces, which the worker sandbox tests need; relax it as ci.yml does.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go vet ./... && go test -count=1 ./...
      - run: |
          for p in sdk dryrun adeept_adr036 cozmo relay ros2 computer voice; do python -m pytest -q plugins/$p/tests; done
      # The packages are built on every tag, and CI already built them on the PR that made this commit: rpm is the
      # only tool Ubuntu does not ship.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - run: scripts/dist.sh "${GITHUB_REF_NAME}"
      # Every release must carry the installer OpenVibe.Bot's GET /install route and BOT_INSTALLER_SOURCE_URL are
      # documented to serve (releases/latest/download/install.sh), the plugin bundle the installer downloads, every
      # OS/architecture the site offers, and the checksums they are verified against.
      - name: the release carries every OS, architecture and package the site offers
        run: |
          test -s dist/install.sh
          test -s dist/openvibe-link-plugins.tar.gz
          test -s dist/SHA256SUMS
          for f in \
            dist/openvibe-link-linux-amd64 dist/openvibe-link-linux-arm64 \
            dist/openvibe-link-darwin-amd64 dist/openvibe-link-darwin-arm64 \
            dist/openvibe-link-windows-amd64.exe dist/openvibe-link-windows-arm64.exe \
            dist/openvibe-link_*_amd64.deb dist/openvibe-link_*_arm64.deb \
            dist/openvibe-link-*-1.x86_64.rpm dist/openvibe-link-*-1.aarch64.rpm \
            dist/openvibe-link_*_linux_amd64.tar.gz dist/openvibe-link_*_linux_arm64.tar.gz \
            dist/openvibe-link_*_darwin_amd64.tar.gz dist/openvibe-link_*_darwin_arm64.tar.gz \
            dist/openvibe-link-linux-amd64 dist/openvibe-link-windows-amd64.exe; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The Android workflow also attaches its APK on a tag, and either job may reach the release first: create it
        # only when it is absent, then upload (clobber) so both workflows can publish to the same tag.
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "OpenVibe Link ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
