[package]
name = "ov-desk"
version = "0.1.0"
edition = "2021"
description = "The Rust desk helper of a lent OpenVibe.Link desktop: capture, encode and input in-process"
license = "AGPL-3.0-only"

[dependencies]
x11rb = { version = "0.13", features = ["shm", "xtest"] }
libc = "0.2"
libloading = "0.8"
serde_json = "1"
base64 = "0.22"
jpeg-encoder = { version = "0.6", features = ["simd"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
